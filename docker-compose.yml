version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: castleco_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: castleco_db
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: castleco_web
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/castleco_db
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: castleco_secure_production_secret_key_2026_x89
      NODE_ENV: production
    depends_on:
      - mysql

volumes:
  mysql_data:
